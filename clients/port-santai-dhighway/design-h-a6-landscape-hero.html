<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <title>Design H — A6 Landscape Hero Foto</title>
  <link rel="stylesheet" href="shared-a6.css" />
  <style>
    @page { size: 148mm 105mm; }
    body { margin: 0; background: #e8e1d6; font-family: "Segoe UI", Inter, system-ui, sans-serif; }
    .sheet {
      background: #fbf8f4;
      color: #17150f;
      padding: 3mm;
      display: flex;
      flex-direction: column;
      gap: 2mm;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2mm;
      padding-bottom: 1.5mm;
      border-bottom: 1.5px solid #2a9d8f;
    }
    .brand-mini h1 { font-size: 9.5pt; }
    .brand-mini h1 em { font-style: italic; color: #2a9d8f; }
    .brand-mini .sub { font-size: 5pt; }
    .table-pill { color: #2a9d8f; font-size: 6pt; flex-shrink: 0; }
    /* Foto besar — baris penuh */
    .hero-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5mm;
      flex: 1;
      min-height: 0;
    }
    .hero-item {
      display: flex;
      flex-direction: column;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #e8e1d6;
      background: #fff;
      min-width: 0;
    }
    .hero-item img {
      width: 100%;
      height: 28mm;
      object-fit: cover;
      display: block;
    }
    .hero-item .cap {
      padding: 1mm 1.5mm;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1mm;
    }
    .hero-item .name { font-size: 5.5pt; font-weight: 700; line-height: 1.1; }
    .hero-item .price { font-size: 6.5pt; font-weight: 800; color: #2a9d8f; white-space: nowrap; }
    .footer-row {
      display: grid;
      grid-template-columns: 20mm 1fr;
      gap: 2.5mm;
      align-items: center;
    }
    .qr-slot { width: 20mm; height: 20mm; color: #2a9d8f; }
    .scan-line { font-size: 7pt; }
    .foot-notes { font-size: 5pt; }
  </style>
</head>
<body>
  <div class="print-bar no-print">
    <span>Design H — A6 Landscape · foto besar baris penuh</span>
    <div><a href="index.html">← Kembali</a><button type="button" onclick="window.print()">Cetak A6</button></div>
  </div>

  <div class="sheet sheet-a6-l">
    <div class="top-bar">
      <header class="brand-mini">
        <h1>Port Santai <em>D'Highway</em></h1>
        <p class="sub">Menu unggulan</p>
      </header>
      <span class="table-pill">Meja ___</span>
    </div>

    <div class="hero-row">
      <article class="hero-item">
        <img src="assets/port-santai-menu-nasi-lemak.png" alt="" />
        <div class="cap"><span class="name">Nasi Lemak</span><span class="price">RM12</span></div>
      </article>
      <article class="hero-item">
        <img src="assets/port-santai-menu-mee-goreng.png" alt="" />
        <div class="cap"><span class="name">Mee Goreng</span><span class="price">RM10</span></div>
      </article>
      <article class="hero-item">
        <img src="assets/port-santai-menu-ikan-bakar.png" alt="" />
        <div class="cap"><span class="name">Ikan Bakar</span><span class="price">RM18</span></div>
      </article>
      <article class="hero-item">
        <img src="assets/port-santai-menu-ketam.png" alt="" />
        <div class="cap"><span class="name">Ketam</span><span class="price">RM28</span></div>
      </article>
    </div>

    <div class="footer-row">
      <div class="qr-slot">QR</div>
      <div>
        <div class="scan-line">Imbas &amp; Pesan · Menu penuh dalam telefon</div>
        <footer class="foot-notes">
          <p><strong>Tiada telefon?</strong> Panggil pelayan. · <strong>Semak</strong> pesanan sebelum hantar.</p>
        </footer>
      </div>
    </div>
  </div>
</body>
</html>
