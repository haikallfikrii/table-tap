<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D — Split berani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { margin: 0; background: #ece7df; font-family: "DM Sans", system-ui, sans-serif; }
    .sheet {
      display: grid;
      grid-template-rows: 42% 58%;
      background: #fff;
      box-sizing: border-box;
    }
    .top {
      background: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6mm;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .top::after {
      content: "";
      position: absolute;
      inset: auto -20% -40% auto;
      width: 70mm;
      height: 70mm;
      border-radius: 50%;
      background: #52b788;
      opacity: 0.22;
    }
    .top h1 {
      position: relative;
      font-family: "Syne", sans-serif;
      font-size: 15pt;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .top p {
      position: relative;
      margin: 2mm 0 0;
      font-size: 8pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #52b788;
    }
    .bottom {
      padding: 6mm;
      display: grid;
      grid-template-columns: 1fr 48mm;
      gap: 4mm;
      align-items: center;
    }
    .copy h2 {
      font-family: "Syne", sans-serif;
      font-size: 13pt;
      margin: 0 0 2mm;
      color: #1a1a1a;
    }
    .copy p {
      margin: 0;
      font-size: 8pt;
      line-height: 1.35;
      color: #5c5c5c;
      font-weight: 600;
    }
    .meja-big {
      margin-top: 4mm;
      font-family: "Syne", sans-serif;
      font-weight: 800;
      color: #1a1a1a;
    }
    .meja-big span {
      display: block;
      font-size: 8pt;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #52b788;
      margin-bottom: 1mm;
    }
    .meja-big b {
      font-size: 28pt;
      letter-spacing: -0.04em;
      font-weight: 800;
    }
    .qr-wrap {
      width: 48mm;
      height: 48mm;
      border: 1.5px solid #e4e4e4;
      border-radius: 3mm;
      padding: 2.5mm;
      box-sizing: border-box;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="print-bar no-print">
    <span>D — Split berani · A6</span>
    <div>
      <label>Meja <select id="meja-select"></select></label>
      <a href="index.html">← Gallery</a>
      <button type="button" onclick="window.print()">Cetak</button>
    </div>
  </div>
  <div class="sheet sheet-a6-p">
    <div class="top">
      <h1>Big Tree Western</h1>
      <p>Western · Burger · Local</p>
    </div>
    <div class="bottom">
      <div class="copy">
        <h2>Imbas QR</h2>
        <p>Order terus dari telefon. Tiada tunggu waiter ambil pesanan.</p>
        <div class="meja-big"><span>Meja</span><b id="meja-num">1</b></div>
      </div>
      <div class="qr-wrap">
        <img class="qr-img" id="qr" src="qr/meja1.png" alt="QR Meja" />
      </div>
    </div>
  </div>
  <script src="table-switcher.js"></script>
</body>
</html>
