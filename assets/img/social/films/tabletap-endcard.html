<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TableTap end card</title>
  <style>
    :root {
      --accent: #e85d04;
      --accent-soft: #fff3ed;
      --warning: #ffd166;
      --warning-soft: #fff8e6;
      --success: #2a9d8f;
      --success-soft: #e6f5f3;
      --info: #457b9d;
      --info-soft: #e8f1f5;
      --ink: #17150f;
      --ink-muted: #666;
      --border: #e5e0d8;
      --bg: #fbf8f4;
      --bg-elevated: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0a; }

    .stage {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      margin: 0 auto;
      background: linear-gradient(145deg, #fbf8f4 0%, #f5efe8 50%, #ebe4d9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 3%;
      gap: 8px;
      font-family: "SF Pro Display", "Segoe UI", Inter, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    .stage::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: 
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(232, 93, 4, 0.12), transparent 50%),
        radial-gradient(ellipse 50% 50% at 80% 70%, rgba(255, 154, 77, 0.1), transparent 50%);
      animation: bgShift 8s ease-in-out infinite;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 50%, rgba(232, 93, 4, 0.15) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.3), 0 8px 32px rgba(0,0,0,0.1);
      pointer-events: none;
    }
    .orb1 { width: 50px; height: 50px; top: 6%; left: 4%; animation: floatOrb1 6s ease-in-out infinite; }
    .orb2 { width: 35px; height: 35px; top: 12%; right: 6%; animation: floatOrb2 5s ease-in-out infinite 0.5s; }
    .orb3 { width: 25px; height: 25px; bottom: 6%; left: 8%; animation: floatOrb3 7s ease-in-out infinite 1s; }
    .orb4 { width: 38px; height: 38px; bottom: 10%; right: 5%; animation: floatOrb1 5.5s ease-in-out infinite 0.8s; }

    /* ============ PHONE MOCKUP - BIGGER ============ */
    .phone-container {
      position: relative;
      width: 68%;
      max-width: 280px;
      animation: phoneEntry 0.8s cubic-bezier(0.2, 1.2, 0.3, 1) both;
      flex-shrink: 0;
    }

    .phone {
      width: 100%;
      aspect-ratio: 9 / 19.5;
      background: linear-gradient(145deg, #1a1a1a 0%, #2d2d2d 100%);
      border-radius: 42px;
      padding: 6px;
      box-shadow: 
        0 25px 70px rgba(0,0,0,0.35),
        0 0 0 2px rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
    }

    /* iPhone Dynamic Island - NO animation */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }
    .dynamic-island::before {
      content: "";
      position: absolute;
      right: 10px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a2a2a, #1a1a1a);
      border: 1px solid #333;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border-radius: 36px;
      overflow: hidden;
      position: relative;
    }

    .screen-header {
      background: linear-gradient(135deg, var(--accent), #ff7b2e);
      padding: 44px 14px 12px;
      text-align: center;
    }
    .screen-header h3 {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .screen-header small {
      color: rgba(255,255,255,0.85);
      font-size: 10px;
    }

    /* ============ SCREEN STATES ============ */
    .screen-content {
      position: absolute;
      top: 68px;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
    }
    .screen-content.active { display: flex; }

    /* State 1: QR Scan */
    .state-qr {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .qr-frame {
      width: 50%;
      aspect-ratio: 1;
      border: 3px solid var(--accent);
      border-radius: 16px;
      position: relative;
      animation: qrPulse 0.8s ease-in-out infinite;
    }
    .qr-frame::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 2px;
      background: var(--accent);
      animation: scanLine 1s ease-in-out infinite;
    }
    .qr-corners { position: absolute; inset: -3px; }
    .qr-corners::before, .qr-corners::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid var(--accent);
    }
    .qr-corners::before { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .qr-corners::after { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .qr-text {
      margin-top: 14px;
      font-size: 10px;
      color: #666;
      animation: blink 0.8s ease-in-out infinite;
    }

    /* State 2: Menu */
    .state-menu {
      flex-direction: column;
      background: #f8f8f8;
      padding: 10px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      opacity: 0;
      transform: translateX(-20px);
    }
    .menu-item.show { animation: menuSlide 0.3s forwards; }
    .menu-item.added {
      background: linear-gradient(135deg, #fff8f5, #fff);
      border: 1px solid rgba(232, 93, 4, 0.3);
    }
    .menu-item.added::after {
      content: "✓";
      margin-left: auto;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
    }
    .menu-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ffeee5, #ffe0d0);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .menu-info { flex: 1; }
    .menu-name { font-size: 11px; font-weight: 600; color: #333; }
    .menu-price { font-size: 10px; color: var(--accent); font-weight: 700; }

    /* State 3: Tracking - MATCHES LIVE UI */
    .state-tracking {
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      padding: 12px;
      overflow-y: auto;
    }

    /* Progress Steps - Like live */
    .track-steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      width: 100%;
      margin-bottom: 10px;
    }
    .track-step {
      font-size: 6px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--ink-muted);
      padding: 6px 2px 8px;
      border-bottom: 3px solid var(--border);
      text-align: center;
    }
    .track-step.done { color: var(--success); border-bottom-color: var(--success); }
    .track-step.current { color: var(--accent); border-bottom-color: var(--accent); animation: stepGlow 1.1s ease-in-out infinite; }

    /* Hero Animation Area */
    .track-hero {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 8px 0;
    }
    .track-stage {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .track-stage.active { display: flex; }

    /* Queue */
    .orb-ring-anim {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 3px dashed var(--accent);
      animation: spin 4.5s linear infinite;
    }
    .orb-ring-anim.delay {
      inset: 22px;
      border-style: solid;
      border-color: transparent transparent var(--warning) var(--warning);
      animation-duration: 1.4s;
      animation-direction: reverse;
    }
    .orb-ticket {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(232, 93, 4, 0.35);
      animation: ticketBob 1.1s ease-in-out infinite;
      z-index: 1;
    }
    .orb-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: var(--warning);
      animation: orbit 2.4s linear infinite;
    }
    .orb-dot.d1 { animation-delay: 0s; }
    .orb-dot.d2 { animation-delay: -0.8s; background: var(--info); }
    .orb-dot.d3 { animation-delay: -1.6s; background: var(--success); }

    /* Cooking */
    .cook-pan {
      position: absolute;
      width: 72px;
      height: 18px;
      bottom: 34px;
      border-radius: 0 0 36px 36px;
      background: #2b2b2b;
      box-shadow: 0 6px 0 #1a1a1a;
    }
    .cook-lid {
      position: absolute;
      width: 58px;
      height: 12px;
      bottom: 50px;
      border-radius: 16px 16px 5px 5px;
      background: #5c5c5c;
      animation: lidHop 0.7s ease-in-out infinite;
    }
    .cook-flame {
      position: absolute;
      bottom: 22px;
      width: 24px;
      height: 18px;
      background: radial-gradient(circle at 50% 80%, #ffd166, var(--accent) 55%, transparent 70%);
      border-radius: 50% 50% 40% 40%;
      animation: flameFlicker 0.28s ease-in-out infinite alternate;
    }
    .cook-steam {
      position: absolute;
      bottom: 62px;
      width: 7px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(transparent, rgba(69, 123, 157, 0.55), transparent);
      animation: steamRise 1.2s ease-in-out infinite;
    }
    .cook-steam.s1 { left: 44px; animation-delay: 0s; }
    .cook-steam.s2 { left: 56px; animation-delay: 0.25s; }
    .cook-steam.s3 { left: 68px; animation-delay: 0.5s; }

    /* Ready */
    .ready-ping {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 3px solid var(--success);
      animation: pingOut 1.5s ease-out infinite;
      opacity: 0;
    }
    .ready-ping.p2 { animation-delay: 0.5s; }
    .ready-ping.p3 { animation-delay: 1s; }
    .ready-bag {
      width: 64px;
      height: 64px;
      border-radius: 16px 16px 18px 18px;
      background: var(--success);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      animation: bagBounce 0.85s cubic-bezier(0.36, 1.4, 0.46, 1) infinite;
      box-shadow: 0 10px 24px rgba(42, 157, 143, 0.4);
    }

    /* Delivering */
    .w-table {
      position: absolute;
      right: 22px;
      bottom: 34px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #c4a574;
      box-shadow: 0 6px 0 #8d6e46;
    }
    .w-person {
      position: absolute;
      left: 22px;
      bottom: 42px;
      width: 16px;
      height: 32px;
      border-radius: 8px 8px 4px 4px;
      background: var(--info);
      animation: wWalk 1s ease-in-out infinite;
    }
    .w-person::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f4d6b8;
    }
    .w-tray {
      position: absolute;
      left: 32px;
      bottom: 60px;
      width: 24px;
      height: 6px;
      border-radius: 3px;
      background: #eee;
      box-shadow: 0 2px 0 #bbb;
      animation: wWalk 1s ease-in-out infinite;
    }

    /* Done */
    .done-check {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 2.2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      animation: checkPop 1.8s ease-in-out infinite;
      box-shadow: 0 10px 28px rgba(232, 93, 4, 0.4);
    }
    .done-burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 2px;
      background: var(--warning);
      animation: sparkSpin 1.6s linear infinite;
    }
    .done-burst.b1 { animation-duration: 1.6s; background: var(--warning); }
    .done-burst.b2 { animation-duration: 2.1s; animation-direction: reverse; background: var(--success); }
    .done-burst.b3 { animation-duration: 1.3s; background: var(--info); }

    /* Status Banner - like live */
    .track-banner {
      width: 100%;
      font-weight: 800;
      font-size: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: center;
      margin: 8px 0;
    }
    .track-banner.queue { background: var(--warning-soft); color: #9a5b00; }
    .track-banner.cooking { background: var(--info-soft); color: var(--info); }
    .track-banner.ready { background: var(--success-soft); color: var(--success); animation: readyFlash 1s ease-in-out infinite; }
    .track-banner.delivering { background: var(--info-soft); color: var(--info); }
    .track-banner.done { background: var(--accent-soft); color: var(--accent); }

    /* Item List - like live */
    .track-items {
      list-style: none;
      width: 100%;
      display: grid;
      gap: 6px;
    }
    .track-item {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      align-items: center;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 9px;
    }
    .track-item-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9a5b00;
      animation: pulseDot 1.4s ease-out infinite;
    }
    .track-item.cooking .track-item-pulse { background: var(--info); animation-duration: 0.9s; }
    .track-item.ready .track-item-pulse { background: var(--success); animation-duration: 0.7s; }
    .track-item.delivering .track-item-pulse { background: var(--info); animation-duration: 0.8s; }
    .track-item.done .track-item-pulse { background: var(--accent); animation: none; }

    .track-pill {
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 12px;
      background: var(--warning-soft);
      color: #9a5b00;
    }
    .track-item.cooking .track-pill { background: var(--info-soft); color: var(--info); }
    .track-item.ready .track-pill { background: var(--success-soft); color: var(--success); }
    .track-item.delivering .track-pill { background: var(--info-soft); color: var(--info); }
    .track-item.done .track-pill { background: var(--accent-soft); color: var(--accent); }

    /* ============ BOTTOM SECTION ============ */
    .bottom-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: linear-gradient(0deg, rgba(251,248,244,1) 0%, rgba(251,248,244,0.95) 70%, transparent 100%);
    }

    .brand-glass {
      background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.5);
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(30px);
    }
    .brand-glass.show { animation: brandEntry 0.5s forwards; }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-small {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(232, 93, 4, 0.25);
    }
    .logo-small.bounce { animation: logoBounce 1.2s ease-in-out infinite; }
    .wordmark {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      color: #17150f;
      letter-spacing: -0.02em;
    }
    .wordmark em { 
      font-style: italic; 
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #ff9a4d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .cta { font-size: 11px; font-weight: 800; color: #17150f; }
    .url-wrap {
      padding: 5px 14px;
      background: linear-gradient(135deg, rgba(232, 93, 4, 0.15) 0%, rgba(232, 93, 4, 0.05) 100%);
      border-radius: 30px;
      border: 1px solid rgba(232, 93, 4, 0.3);
    }
    .url-wrap.pulse { animation: urlPulse 1.5s ease-in-out infinite; }
    .url {
      font-size: 13px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #d45004);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub { font-size: 8px; color: #5b564c; }

    /* ============ KEYFRAMES ============ */
    @keyframes bgShift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(5%, -3%) rotate(2deg); }
      66% { transform: translate(-3%, 5%) rotate(-2deg); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      50% { transform: translate(15px, -20px) scale(1.1); opacity: 0.9; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
      50% { transform: translate(-20px, 15px) scale(0.9); opacity: 0.8; }
    }
    @keyframes floatOrb3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      50% { transform: translate(10px, -10px) scale(1.15); opacity: 0.7; }
    }
    @keyframes phoneEntry {
      0% { opacity: 0; transform: translateY(50px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes qrPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    @keyframes scanLine { 0%, 100% { top: 10%; } 50% { top: 85%; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes menuSlide { to { opacity: 1; transform: translateX(0); } }
    @keyframes stepGlow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

    /* Tracking animations - match app.css */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ticketBob {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(6deg); }
    }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(52px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(52px) rotate(-360deg); }
    }
    @keyframes lidHop {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    @keyframes flameFlicker {
      from { transform: scaleY(0.85) scaleX(1.1); opacity: 0.75; }
      to { transform: scaleY(1.15) scaleX(0.9); opacity: 1; }
    }
    @keyframes steamRise {
      0% { transform: translateY(8px) scaleY(0.6); opacity: 0; }
      40% { opacity: 0.8; }
      100% { transform: translateY(-28px) scaleY(1.2); opacity: 0; }
    }
    @keyframes pingOut {
      0% { transform: scale(0.45); opacity: 0.85; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes bagBounce {
      0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
      40% { transform: translateY(-16px) rotate(5deg) scale(1.08); }
      70% { transform: translateY(-4px) rotate(-2deg); }
    }
    @keyframes wWalk {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(40px); }
    }
    @keyframes checkPop {
      0%, 100% { transform: scale(1) rotate(-8deg); }
      35% { transform: scale(1.12) rotate(8deg); }
      55% { transform: scale(0.94) rotate(-3deg); }
    }
    @keyframes sparkSpin {
      from { transform: rotate(0deg) translateX(48px) scale(0.6); }
      50% { transform: rotate(180deg) translateX(48px) scale(1.2); }
      to { transform: rotate(360deg) translateX(48px) scale(0.6); }
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(154, 91, 0, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(154, 91, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(154, 91, 0, 0); }
    }
    @keyframes readyFlash {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes brandEntry {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes logoBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-3deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-2px) rotate(2deg); }
    }
    @keyframes urlPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 93, 4, 0); }
      50% { transform: scale(1.03); box-shadow: 0 0 20px 5px rgba(232, 93, 4, 0.15); }
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="stage">
    <div class="phone-container">
      <div class="phone">
        <div class="dynamic-island"></div>
        <div class="phone-screen">
          <div class="screen-header">
            <h3>TableTap</h3>
            <small>Meja 5</small>
          </div>

          <!-- State 1: QR Scan -->
          <div class="screen-content state-qr active" id="state-qr">
            <div class="qr-frame">
              <div class="qr-corners"></div>
            </div>
            <div class="qr-text">Imbas kod QR...</div>
          </div>

          <!-- State 2: Menu -->
          <div class="screen-content state-menu" id="state-menu">
            <div class="menu-item added" id="m1">
              <div class="menu-icon">🍜</div>
              <div class="menu-info">
                <div class="menu-name">Laksa Sarawak</div>
                <div class="menu-price">RM12</div>
              </div>
            </div>
            <div class="menu-item added" id="m2">
              <div class="menu-icon">🥤</div>
              <div class="menu-info">
                <div class="menu-name">Teh Tarik</div>
                <div class="menu-price">RM3</div>
              </div>
            </div>
            <div class="menu-item added" id="m3">
              <div class="menu-icon">🍰</div>
              <div class="menu-info">
                <div class="menu-name">Kek Lapis</div>
                <div class="menu-price">RM5</div>
              </div>
            </div>
          </div>

          <!-- State 3: Tracking -->
          <div class="screen-content state-tracking" id="state-tracking">
            <div class="track-steps" id="track-steps">
              <div class="track-step" data-step="queue">Antrian</div>
              <div class="track-step" data-step="cooking">Masak</div>
              <div class="track-step" data-step="ready">Siap</div>
              <div class="track-step" data-step="delivering">Hantar</div>
              <div class="track-step" data-step="done">Selesai</div>
            </div>

            <div class="track-hero" id="track-hero">
              <!-- Queue -->
              <div class="track-stage" id="stage-queue">
                <span class="orb-ring-anim"></span>
                <span class="orb-ring-anim delay"></span>
                <span class="orb-ticket">#</span>
                <i class="orb-dot d1"></i>
                <i class="orb-dot d2"></i>
                <i class="orb-dot d3"></i>
              </div>
              <!-- Cooking -->
              <div class="track-stage" id="stage-cooking">
                <span class="cook-pan"></span>
                <span class="cook-lid"></span>
                <span class="cook-steam s1"></span>
                <span class="cook-steam s2"></span>
                <span class="cook-steam s3"></span>
                <span class="cook-flame"></span>
              </div>
              <!-- Ready -->
              <div class="track-stage" id="stage-ready">
                <span class="ready-ping p1"></span>
                <span class="ready-ping p2"></span>
                <span class="ready-ping p3"></span>
                <span class="ready-bag">!</span>
              </div>
              <!-- Delivering -->
              <div class="track-stage" id="stage-delivering">
                <span class="w-table"></span>
                <span class="w-tray"></span>
                <span class="w-person"></span>
              </div>
              <!-- Done -->
              <div class="track-stage" id="stage-done">
                <span class="done-burst b1"></span>
                <span class="done-burst b2"></span>
                <span class="done-burst b3"></span>
                <span class="done-check">✓</span>
              </div>
            </div>

            <div class="track-banner" id="track-banner">Dalam Antrian</div>

            <ul class="track-items" id="track-items">
              <li class="track-item" id="item1">
                <span class="track-item-pulse"></span>
                <span><b>1×</b> Laksa Sarawak</span>
                <span class="track-pill">Menunggu</span>
              </li>
              <li class="track-item" id="item2">
                <span class="track-item-pulse"></span>
                <span><b>1×</b> Teh Tarik</span>
                <span class="track-pill">Menunggu</span>
              </li>
              <li class="track-item" id="item3">
                <span class="track-item-pulse"></span>
                <span><b>1×</b> Kek Lapis</span>
                <span class="track-pill">Menunggu</span>
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="brand-glass" id="brand">
        <div class="logo-row">
          <img class="logo-small" id="logo" src="../../brand/apple-touch-icon.png" alt="TableTap" />
          <div class="wordmark">Table<em>Tap</em></div>
        </div>
        <div class="cta">Jom pakai TableTap</div>
        <div class="url-wrap" id="url-wrap">
          <span class="url">tabletap.my</span>
        </div>
        <div class="sub">RM29 sebulan. Tak sampai RM1 sehari.</div>
      </div>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
    function playTone(freq, dur, type = 'sine', vol = 0.12) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }
    function playPop() { playTone(800, 0.08); setTimeout(() => playTone(1200, 0.05, 'sine', 0.08), 30); }
    function playScan() { playTone(440, 0.15, 'triangle', 0.1); setTimeout(() => playTone(880, 0.2, 'triangle', 0.12), 100); }
    function playSuccess() { playTone(523, 0.12, 'sine', 0.1); setTimeout(() => playTone(659, 0.12, 'sine', 0.1), 100); setTimeout(() => playTone(784, 0.2, 'sine', 0.12), 200); }
    function playNotif() { playTone(698, 0.1, 'sine', 0.1); setTimeout(() => playTone(880, 0.15, 'sine', 0.1), 80); }
    function playDing() { playTone(1047, 0.3, 'sine', 0.15); }

    const stages = ['queue', 'cooking', 'ready', 'delivering', 'done'];
    const stageLabels = { queue: 'Dalam Antrian', cooking: 'Sedang Dimasak', ready: 'Siap!', delivering: 'Sedang Dihantar', done: 'Selesai!' };
    const itemLabels = { queue: 'Menunggu', cooking: 'Dimasak', ready: 'Siap', delivering: 'Dihantar', done: 'Selesai' };

    function setStage(stage) {
      // Hero animation
      document.querySelectorAll('.track-stage').forEach(el => el.classList.remove('active'));
      const stageEl = document.getElementById('stage-' + stage);
      if (stageEl) stageEl.classList.add('active');

      // Steps
      const idx = stages.indexOf(stage);
      document.querySelectorAll('.track-step').forEach((el, i) => {
        el.classList.remove('done', 'current');
        if (i < idx) el.classList.add('done');
        else if (i === idx) el.classList.add('current');
      });

      // Banner
      const banner = document.getElementById('track-banner');
      banner.className = 'track-banner ' + stage;
      banner.textContent = stageLabels[stage];

      // Items
      document.querySelectorAll('.track-item').forEach(el => {
        el.className = 'track-item ' + stage;
        el.querySelector('.track-pill').textContent = itemLabels[stage];
      });
    }

    function showScreen(id) {
      document.querySelectorAll('.screen-content').forEach(el => el.classList.remove('active'));
      document.getElementById(id)?.classList.add('active');
    }

    // Timeline
    function runTimeline() {
      // QR scan
      setTimeout(playScan, 1500);

      // Menu
      setTimeout(() => showScreen('state-menu'), 2000);
      setTimeout(() => { document.getElementById('m1').classList.add('show'); playPop(); }, 2300);
      setTimeout(() => { document.getElementById('m2').classList.add('show'); playPop(); }, 2700);
      setTimeout(() => { document.getElementById('m3').classList.add('show'); playPop(); }, 3100);

      // Tracking
      setTimeout(() => { showScreen('state-tracking'); setStage('queue'); playNotif(); }, 4000);
      setTimeout(() => { setStage('cooking'); playNotif(); }, 5300);
      setTimeout(() => { setStage('ready'); playNotif(); }, 6600);
      setTimeout(() => { setStage('delivering'); playNotif(); }, 7900);
      setTimeout(() => { setStage('done'); playSuccess(); }, 9200);

      // Brand
      setTimeout(() => {
        document.getElementById('brand').classList.add('show');
        playDing();
      }, 10000);
      setTimeout(() => document.getElementById('logo').classList.add('bounce'), 10500);
      setTimeout(() => document.getElementById('url-wrap').classList.add('pulse'), 10500);
    }

    document.body.addEventListener('click', function start() {
      initAudio();
      document.body.removeEventListener('click', start);
      runTimeline();
    }, { once: true });

    setTimeout(() => {
      try { initAudio(); runTimeline(); } catch(e) { console.log('Click to start'); }
    }, 500);
  </script>
</body>
</html>
